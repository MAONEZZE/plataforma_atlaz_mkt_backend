[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "atlaz-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "supabase>=2.5",
    "httpx>=0.27",
    "structlog>=24.2",
    "sentry-sdk[fastapi]>=2.6",
    "slowapi>=0.1.9",
    "typer>=0.12",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "testcontainers[postgres]>=4.7",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "import-linter>=2.1",
    "types-python-jose>=3.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]

[tool.ruff]
target-version = "py312"
line-length = 99
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"app/database/migrations/env.py" = ["E402"]

[tool.black]
line-length = 99
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/database/migrations/", "scripts/"]
cache_dir = ".cache/mypy"

[[tool.mypy.overrides]]
module = ["jose.*", "supabase.*", "slowapi.*", "testcontainers.*", "sentry_sdk.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain does not import infrastructure"
type = "forbidden"
source_modules = [
    "app.domain.auth_module",
    "app.domain.user_module",
    "app.domain.metrics_module",
    "app.domain.content_module",
    "app.domain.community_module",
    "app.domain.event_module",
]
forbidden_modules = [
    "app.database",
]

[[tool.importlinter.contracts]]
name = "Domain does not import presentation"
type = "forbidden"
source_modules = [
    "app.domain.auth_module",
    "app.domain.user_module",
    "app.domain.metrics_module",
    "app.domain.content_module",
    "app.domain.community_module",
    "app.domain.event_module",
]
forbidden_modules = [
    "app.api.controllers",
]

[[tool.importlinter.contracts]]
name = "Domain does not import frameworks"
type = "forbidden"
source_modules = [
    "app.domain.auth_module",
    "app.domain.user_module",
    "app.domain.metrics_module",
    "app.domain.content_module",
    "app.domain.community_module",
    "app.domain.event_module",
]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "supabase",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=0"
cache_dir = ".cache/pytest"
